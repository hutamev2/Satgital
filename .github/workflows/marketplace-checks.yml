name: Marketplace SQL checks
on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/marketplace-checks.yml"]
  push:
    paths: ["supabase/**", ".github/workflows/marketplace-checks.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase and apply migrations
        run: npx --no-install supabase start
      - name: Verify buyer, seller and price comparison
        env:
          PGHOST: localhost
          PGPORT: 54322
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/checks/purchase_flow.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/checks/market_prices.sql
